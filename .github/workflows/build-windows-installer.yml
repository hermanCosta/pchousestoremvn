name: Build Windows Installer

on:
  push:
    branches: [ main ]
  workflow_dispatch: # allows manual trigger from GitHub UI

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Build project with Maven
        run: mvn clean package -DskipTests

      - name: Create Windows installer (.exe)
        run: |
          jpackage `
            --type exe `
            --input target `
            --name PcHouseStore `
            --main-jar pchousestoremvn-1.0-SNAPSHOT-jar-with-dependencies.jar `
            --main-class com.pchouse.pchousestoremvn.MainApp `
            --icon installer/resources/app.ico `
            --app-version "1.0.0" `
            --vendor "PcHouse Software" `
            --java-options "--enable-preview" `
            --dest output

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: PcHouseStore-Windows-Installer
          path: output/
